spring:
  application:
    name: make-app

  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XE
    username: ${DB_USER:makeapp}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

spring.output.ansi.enabled: always

logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

jwt:
  secret: ${JWT_SECRET:make-app-secret-key-must-be-at-least-256-bits-long!!}
  access-expiration: 3600000      # 1시간 (ms)
  refresh-expiration: 604800000   # 7일 (ms)

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/auth/callback}
